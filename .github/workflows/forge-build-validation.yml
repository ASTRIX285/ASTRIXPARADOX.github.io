name: Forge build validation

on:
  pull_request:
    paths:
      - 'astrix-app/data/armor-3-builds.json'
      - 'astrix-app/data/armor-3-build.schema.json'
      - 'astrix-app/tools/validate-builds.mjs'
      - 'astrix-app/package.json'
      - '.github/workflows/forge-build-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-build-content:
    name: Validate build content
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: astrix-app

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install validation dependencies
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Validate schema, verification gate and readiness
        run: npm run validate
