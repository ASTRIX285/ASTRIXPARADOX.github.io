name: Validate Build Design selectors

on:
  pull_request:
    paths:
      - 'astrix-app/pages/guardian-workspace-v2/paradox-build-space/**'
      - 'astrix-app/pages/guardian-workspace-v2/paradox-build-space-handoff.mjs'
      - 'astrix-app/pages/guardian-workspace-v2/paradox-build-binding.mjs'
      - 'astrix-app/tools/test-build-design-artifact-intent.mjs'
      - 'astrix-app/tools/test-build-space-character-isolation.mjs'
      - '.github/workflows/validate-build-design-selectors.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Check Build Design modules
        run: |
          node --check astrix-app/pages/guardian-workspace-v2/paradox-build-space/paradox-build-state.mjs
          node --check astrix-app/pages/guardian-workspace-v2/paradox-build-space/paradox-forge-intelligence.mjs
          node --check astrix-app/pages/guardian-workspace-v2/paradox-build-space/paradox-build-space.mjs
          node --check astrix-app/pages/guardian-workspace-v2/paradox-build-space-handoff.mjs
          node --check astrix-app/pages/guardian-workspace-v2/paradox-build-binding.mjs
      - name: Test intended Artifact configuration
        run: node astrix-app/tools/test-build-design-artifact-intent.mjs
      - name: Test character-bound Build handoff
        run: node astrix-app/tools/test-build-space-character-isolation.mjs
