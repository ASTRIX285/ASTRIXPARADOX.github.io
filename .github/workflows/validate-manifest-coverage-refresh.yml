name: Manifest coverage and active refresh
on:
  pull_request:
    branches: [main]
    paths:
      - '.scope/feat/manifest-coverage-refresh.txt'
      - '.github/workflows/validate-manifest-coverage-refresh.yml'
      - 'astrix-app/tools/build-backend-manifest.py'
      - 'astrix-app/tools/test-manifest-coverage.py'
      - 'astrix-app/tools/test-active-profile-refresh.mjs'
      - 'astrix-app/core/active-profile-refresh.mjs'
      - 'astrix-app/pages/guardian-workspace-v2/guardian-session-cache.mjs'
      - 'forge-manifest-worker/**'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Branch scope
        run: node astrix-app/tools/validate-scope-guard.mjs
      - name: Journey validation
        if: always()
        run: node astrix-app/tools/validate-journey-visual-pass.mjs
      - name: Registered validation suite
        if: always()
        run: node astrix-app/tools/paradox-validator.mjs
      - name: Export tracked source for local validation
        if: always()
        run: |
          git archive --format=tar HEAD | gzip > "$RUNNER_TEMP/manifest-source.tar.gz"
          git rev-parse HEAD HEAD^{tree} > "$RUNNER_TEMP/manifest-source-identity.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: manifest-coverage-source
          path: |
            ${{ runner.temp }}/manifest-source.tar.gz
            ${{ runner.temp }}/manifest-source-identity.txt
          retention-days: 1
