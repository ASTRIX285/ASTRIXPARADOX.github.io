name: Update Twitch Status

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

# Never run two status checks at once; a newer run replaces an older one
concurrency:
  group: twitch-status
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  check-twitch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Check Twitch status and fetch VOD
        env:
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
        run: |
          python3 - << 'PYEOF'
          import json, urllib.request, urllib.parse, os, sys

          CLIENT_ID     = os.environ['TWITCH_CLIENT_ID']
          CLIENT_SECRET = os.environ['TWITCH_CLIENT_SECRET']

          def api(url, token=None):
              req = urllib.request.Request(url)
              if token:
                  req.add_header('Client-ID', CLIENT_ID)
                  req.add_header('Authorization', f'Bearer {token}')
              with urllib.request.urlopen(req) as r:
                  raw = r.read()
                  print(f'API response for {url}:\n{raw.decode()}\n')
                  return json.loads(raw)

          def post(url, data):
              encoded = urllib.parse.urlencode(data).encode()
              req = urllib.request.Request(url, data=encoded, method='POST')
              with urllib.request.urlopen(req) as r:
                  return json.loads(r.read())

          # Step 1 — Get token
          try:
              tok = post('https://id.twitch.tv/oauth2/token', {
                  'client_id': CLIENT_ID,
                  'client_secret': CLIENT_SECRET,
                  'grant_type': 'client_credentials'
              })
              token = tok['access_token']
              print('Token OK')
          except Exception as e:
              print(f'Auth failed: {e}', file=sys.stderr)
              sys.exit(1)

          # Step 2 — Get user_id
          users = api('https://api.twitch.tv/helix/users?login=astrix285x', token)
          user_id = users['data'][0]['id'] if users.get('data') else ''
          print(f'User ID: {user_id}')

          # Step 3 — Check if live
          streams = api('https://api.twitch.tv/helix/streams?user_login=astrix285x', token)
          is_live = len(streams.get('data', [])) > 0
          print(f'is_live = {is_live}')

          result = {'live': is_live}

          if is_live:
              s = streams['data'][0]
              result['title']   = s.get('title', '')
              result['game']    = s.get('game_name', '')
              result['viewers'] = s.get('viewer_count', 0)
              print(f'LIVE: {result["title"]} | Game: {result["game"]} | Viewers: {result["viewers"]}')
          else:
              # Step 4 — The newest VOD a viewer can actually watch (Miguel, 2 Nov 2026).
              # Twitch leaves a deleted VOD out of this list. A VOD that is still processing, or set to
              # private, is skipped for the one before it, and so on down the last 20.
              def watchable(v):
                  if v.get('viewable', 'public') != 'public':
                      return False, 'not public'
                  if '404_processing' in (v.get('thumbnail_url') or '') or not v.get('duration'):
                      return False, 'still processing'
                  return True, ''

              vods = api(f'https://api.twitch.tv/helix/videos?user_id={user_id}&type=archive&first=20', token)
              chosen = None
              for v in vods.get('data', []):
                  ok, why = watchable(v)
                  if ok:
                      chosen = v
                      break
                  print(f'Skipping VOD {v.get("id")} ({v.get("title", "")}): {why}')

              if chosen:
                  result['vod_id']    = chosen.get('id', '')
                  result['vod_title'] = chosen.get('title', '')
                  result['vod_url']   = chosen.get('url', '')
                  print(f'VOD: {result["vod_title"]}')
              else:
                  # No watchable VOD: write none, so the site never embeds a deleted or unpublished one.
                  print('No watchable VODs found')

          with open('twitch-status.json', 'w') as f:
              json.dump(result, f)

          print(f'\n=== FINAL JSON WRITTEN ===\n{json.dumps(result, indent=2)}\n==========================')
          PYEOF

      - name: Show written file
        run: cat twitch-status.json

      - name: Commit status file
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add twitch-status.json
          if git diff --cached --quiet; then
            echo "No status change, nothing to commit."
            exit 0
          fi
          git commit -m "Update Twitch status [$(date -u '+%H:%M:%S UTC')]"

          # Other bots push to main often. If main moved while this job ran,
          # pull the new commits, keep our status file, and push again.
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then
              echo "Pushed on attempt $attempt."
              exit 0
            fi
            echo "Push rejected (attempt $attempt). Rebasing onto latest main..."
            git pull --rebase -X theirs origin main || { git rebase --abort; exit 1; }
            sleep $(( attempt * 5 ))
          done
          echo "Could not push after 5 attempts." >&2
          exit 1
