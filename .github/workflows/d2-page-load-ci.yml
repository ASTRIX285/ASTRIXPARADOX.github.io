name: D2 page load validation

on:
  push:
    branches:
      - codex/d2-page-load-recovery
    paths:
      - '.github/workflows/d2-page-load-ci.yml'
      - 'astrix-app/pages/journey/journey.mjs'
      - 'astrix-app/tools/build-backend-manifest.py'
      - 'astrix-app/tools/test-backend-data.mjs'
      - 'astrix-app/tools/validate-forge-loader.mjs'
      - 'astrix-app/tools/validate-journey-visual-pass.mjs'
      - 'astrix-app/tools/validate-page-ready-performance.mjs'
      - 'forge-auth-worker/**'
      - 'forge-manifest-worker/worker.mjs'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate auth Worker
        working-directory: forge-auth-worker
        run: |
          npm install
          npm run check
      - name: Validate backend and page contracts
        run: |
          node astrix-app/tools/test-backend-data.mjs
          node astrix-app/tools/validate-forge-loader.mjs
          node astrix-app/tools/validate-journey-visual-pass.mjs
          node astrix-app/tools/validate-page-ready-performance.mjs
          node astrix-app/tools/validate-renderable-page-data.mjs
          node astrix-app/tools/validate-shared-page-load.mjs
