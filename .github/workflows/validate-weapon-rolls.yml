name: Validate Paradox Guardian evidence

on:
  pull_request:
    branches: [main]
    paths:
      - 'astrix-app/data/paradox-forge/beta/**'
      - 'astrix-app/pages/guardian-workspace-v2/guardian-paradox-engine.mjs'
      - 'astrix-app/pages/guardian-workspace-v2/guardian-fixture-loader.mjs'
      - 'astrix-app/pages/guardian-workspace-v2/guardian-semantic-resolver.mjs'
      - 'astrix-app/pages/guardian-workspace-v2/guardian-semantic-interceptor.mjs'
      - 'astrix-app/pages/guardian-workspace-v2/guardian-paradox-live-adapter.mjs'
      - 'astrix-app/pages/guardian-workspace-v2/guardian-armour-set-resolver.mjs'
      - 'astrix-app/pages/guardian-workspace-v2/guardian-semantic-ui.mjs'
      - 'astrix-app/pages/guardian-workspace-v2/guardian-gear-layout.mjs'
      - 'astrix-app/pages/guardian-workspace-v2/guardian-workspace-v2.mjs'
      - 'astrix-app/pages/guardian-workspace-v2/index.html'
      - 'astrix-app/tools/**'
      - '.github/workflows/validate-weapon-rolls.yml'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '20'
      - name: Check Guardian UI module syntax
        run: |
          node --check astrix-app/pages/guardian-workspace-v2/guardian-semantic-ui.mjs
          node --check astrix-app/pages/guardian-workspace-v2/guardian-gear-layout.mjs
          node --check astrix-app/pages/guardian-workspace-v2/guardian-workspace-v2.mjs
      - name: Extract base fixture
        id: base
        run: |
          FIX=astrix-app/data/paradox-forge/beta/ASTRIX_Paradox_Forge_Beta_Fixtures_v1.json
          if [ -n "${{ github.event.pull_request.base.sha }}" ]; then
            git show "${{ github.event.pull_request.base.sha }}:$FIX" > /tmp/base-fixtures.json 2>/dev/null \
              && echo "have_base=true" >> "$GITHUB_OUTPUT" \
              || echo "have_base=false" >> "$GITHUB_OUTPUT"
          else
            echo "have_base=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Hydrate canonical weapon perk evidence
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs/promises';
          const basePath='astrix-app/data/paradox-forge/beta/beta-bungie-manifest-cache.json';
          const extPath='astrix-app/data/paradox-forge/beta/beta-bungie-manifest-cache-weapon-perk-extension.json';
          const base=JSON.parse(await fs.readFile(basePath,'utf8'));
          const ext=JSON.parse(await fs.readFile(extPath,'utf8'));
          base.inventoryItems={...(base.inventoryItems||{}),...(ext.inventoryItems||{})};
          await fs.writeFile(basePath,JSON.stringify(base));
          console.log(`Hydrated ${Object.keys(ext.inventoryItems||{}).length} canonical weapon perk definitions`);
          NODE
      - name: Run engine self-test
        run: node astrix-app/tools/test-weapon-roll-nodes.mjs > /tmp/selftest.out
      - name: Run weapon and engine validation
        run: |
          if [ "${{ steps.base.outputs.have_base }}" = "true" ]; then
            node astrix-app/tools/validate-weapon-rolls.mjs --base /tmp/base-fixtures.json
          else
            node astrix-app/tools/validate-weapon-rolls.mjs
          fi
      - name: Run Guardian semantic validation
        run: node astrix-app/tools/validate-guardian-semantics.mjs
