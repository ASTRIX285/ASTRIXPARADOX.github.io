name: Validate Shooting Range capture

on:
  pull_request:
    paths:
      - 'astrix-app/pages/guardian-workspace-v2/guardian-shooting-range-capture.mjs'
      - 'astrix-app/pages/guardian-workspace-v2/guardian-shooting-range-evidence.mjs'
      - 'astrix-app/pages/guardian-workspace-v2/paradox-build-space/**'
      - 'astrix-app/tools/test-shooting-range-evidence.mjs'
      - 'astrix-app/pages/guardian-workspace-v2/shooting-range-test/**'
      - '.github/workflows/validate-shooting-range-capture.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Syntax check capture module
        run: |
          node --check astrix-app/pages/guardian-workspace-v2/guardian-shooting-range-capture.mjs
          node --check astrix-app/pages/guardian-workspace-v2/guardian-shooting-range-evidence.mjs
          node --check astrix-app/pages/guardian-workspace-v2/paradox-build-space/paradox-build-space.mjs
      - name: Test candidate and evidence classification
        run: node astrix-app/tools/test-shooting-range-evidence.mjs
      - name: Validate evidence-first contract
        run: |
          grep -q "backend-route-missing" astrix-app/pages/guardian-workspace-v2/guardian-shooting-range-capture.mjs
          grep -q "baselineInstanceIds" astrix-app/pages/guardian-workspace-v2/guardian-shooting-range-capture.mjs
          grep -q "rawPgcr" astrix-app/pages/guardian-workspace-v2/guardian-shooting-range-capture.mjs
          grep -q "pgcr-without-pgcr-hash-identity" astrix-app/pages/guardian-workspace-v2/guardian-shooting-range-evidence.mjs
          grep -q "shootingRangeIdentification:'unverified'" astrix-app/pages/guardian-workspace-v2/guardian-shooting-range-evidence.mjs
          if grep -q "activityName:'Shooting Range'" astrix-app/pages/guardian-workspace-v2/guardian-shooting-range-capture.mjs; then
            echo 'Capture module must not invent a Shooting Range activity identity.'
            exit 1
          fi
