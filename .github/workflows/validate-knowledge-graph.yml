name: Validate Forge Knowledge Graph

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'astrix-app/data/knowledge-relationships.json'
      - 'astrix-app/data/knowledge-relationships.curated.json'
      - 'astrix-app/data/knowledge-relationships.schema.json'
      - 'astrix-app/tools/build-knowledge-relationships.py'
      - 'astrix-app/tools/validate-knowledge-graph.py'
      - 'astrix-app/data/armor-3-components.json'
      - 'astrix-app/data/armor-3-builds.json'
      - 'astrix-app/data/counter-rules.json'
      - 'astrix-app/data/game-components.catalogue.json'
      - 'astrix-app/data/weapon-information.catalogue.json'
      - 'astrix-app/data/armor-information.catalogue.json'

permissions:
  contents: write

concurrency:
  group: forge-knowledge-graph-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-knowledge-graph:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout selected ref
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install schema validator
        run: python3 -m pip install "jsonschema[format]>=4.23,<5"

      - name: Build verified knowledge relationships
        run: python3 astrix-app/tools/build-knowledge-relationships.py

      - name: Validate relationship schema
        run: |
          python3 - << 'PYEOF'
          import json
          from pathlib import Path
          from jsonschema import Draft202012Validator, FormatChecker

          data = json.loads(
              Path('astrix-app/data/knowledge-relationships.json')
              .read_text(encoding='utf-8')
          )
          schema = json.loads(
              Path('astrix-app/data/knowledge-relationships.schema.json')
              .read_text(encoding='utf-8')
          )
          errors = sorted(
              Draft202012Validator(
                  schema,
                  format_checker=FormatChecker(),
              ).iter_errors(data),
              key=lambda error: list(error.absolute_path),
          )
          if errors:
              for error in errors:
                  print(f"{list(error.absolute_path)}: {error.message}")
              raise SystemExit(f"{len(errors)} schema error(s)")
          print(f"Schema valid: {len(data['relationships'])} relationship(s)")
          PYEOF

      - name: Validate graph references
        run: python3 astrix-app/tools/validate-knowledge-graph.py

      - name: Check generated graph change
        id: generated
        run: |
          if [ -n "$(git status --porcelain -- astrix-app/data/knowledge-relationships.json)" ]
          then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit generated graph
        if: github.event_name == 'workflow_dispatch' && steps.generated.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add astrix-app/data/knowledge-relationships.json
          git diff --cached --quiet && exit 0
          git commit -m "Update verified Paradox Forge knowledge graph"
          git push origin "HEAD:${GITHUB_REF_NAME}"
