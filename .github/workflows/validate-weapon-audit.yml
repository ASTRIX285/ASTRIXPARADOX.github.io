name: Validate PARADOX weapon audit
on:
  push:
    branches: ['paradox/weapon-audit-20260905']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Catalogue and application regression gates
        env:
          BUNGIE_API_KEY: ${{ secrets.BUNGIE_API_KEY }}
          FORGE_INDEX_ONLY: '1'
        run: |
          python3 astrix-app/tools/import-armor-information.py
          node astrix-app/tools/paradox-validator.mjs
      - name: Verify generated index transport
        run: node astrix-app/tools/test-forge-index-transport.mjs
      - name: Sandbox deployment contract
        run: node astrix-app/tools/validate-sandbox-deployment.mjs
      - name: Auth Worker build
        working-directory: forge-auth-worker
        run: |
          npm install --ignore-scripts --package-lock=false
          npm run check
      - name: Install browser test runtime
        run: |
          npm install --prefix "$RUNNER_TEMP/weapon-card-qa" playwright@1.62.1
          node "$RUNNER_TEMP/weapon-card-qa/node_modules/playwright/cli.js" install --with-deps chromium
      - name: Render every weapon type at four widths
        env:
          PLAYWRIGHT_MODULE_PATH: ${{ runner.temp }}/weapon-card-qa/node_modules/playwright/index.mjs
          WEAPON_QA_OUTPUT: ${{ runner.temp }}/weapon-card-results
        run: node astrix-app/tools/test-weapon-cards-browser.mjs
      - name: Preserve card validation results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: paradox-weapon-card-validation
          path: ${{ runner.temp }}/weapon-card-results
          if-no-files-found: ignore
