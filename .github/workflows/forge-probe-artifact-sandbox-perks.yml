name: Forge Probe Artifact Sandbox Perks
on:
  push:
    branches: [feature/astrix-multigame-platform]
    paths: ['.github/workflows/forge-probe-artifact-sandbox-perks.yml']
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/astrix-multigame-platform
      - run: python3 .forge-community/probe-current-artifact-v2.py >/dev/null
      - run: |
          python3 - <<'PY'
          import json,sqlite3
          def s(h): return h if h<2147483648 else h-4294967296
          c=sqlite3.connect('/tmp/world.content').cursor()
          for h in [4217417017,3619040076,3834273539,2903198435,2742146817]:
            d=json.loads(c.execute('select json from DestinyInventoryItemDefinition where id=?',(s(h),)).fetchone()[0])
            slim={k:d.get(k) for k in ['hash','displayProperties','perks','plug','traitIds','itemCategoryHashes']}
            print('ITEM='+json.dumps(slim,separators=(',',':')))
            for p in d.get('perks') or []:
              ph=p.get('perkHash')
              row=c.execute('select json from DestinySandboxPerkDefinition where id=?',(s(ph),)).fetchone()
              if row:
                sd=json.loads(row[0]); print('SANDBOX='+json.dumps({'hash':ph,'displayProperties':sd.get('displayProperties')},separators=(',',':')))
          PY
