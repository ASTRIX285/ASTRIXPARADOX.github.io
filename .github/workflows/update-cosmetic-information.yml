name: Update Forge Cosmetic Information

on:
  workflow_dispatch:
  schedule:
    - cron: '47 4 * * 1'

permissions:
  contents: write

concurrency:
  group: forge-cosmetic-information-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update-cosmetic-information:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout workflow branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install validation dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install "jsonschema[format]>=4.23,<5"

      - name: Generate cosmetic catalogue
        id: cosmetics
        env:
          BUNGIE_API_KEY: ${{ secrets.BUNGIE_API_KEY }}
        run: |
          python3 astrix-app/tools/import-cosmetic-information.py

      - name: Validate cosmetic catalogue
        run: |
          python3 - << 'PYEOF'
          import json
          from pathlib import Path
          from jsonschema import Draft202012Validator, FormatChecker

          catalogue_path = Path("astrix-app/data/cosmetic-information.json")
          schema_path = Path("astrix-app/data/cosmetic-information.schema.json")
          catalogue = json.loads(catalogue_path.read_text(encoding="utf-8"))
          schema = json.loads(schema_path.read_text(encoding="utf-8"))

          errors = sorted(
              Draft202012Validator(schema, format_checker=FormatChecker()).iter_errors(catalogue),
              key=lambda error: list(error.absolute_path),
          )
          if errors:
              for error in errors:
                  print(f"{list(error.absolute_path)}: {error.message}")
              raise SystemExit(f"{len(errors)} schema validation error(s)")

          ids, hashes = set(), set()
          for index, cosmetic in enumerate(catalogue["cosmetics"]):
              expected_id = f"cosmetic-{cosmetic['bungieHash']}"
              if cosmetic["id"] != expected_id:
                  raise SystemExit(f"Invalid id at cosmetics[{index}]: expected {expected_id}")
              if cosmetic["id"] in ids:
                  raise SystemExit(f"Duplicate cosmetic id: {cosmetic['id']}")
              if cosmetic["bungieHash"] in hashes:
                  raise SystemExit(f"Duplicate cosmetic hash: {cosmetic['bungieHash']}")
              ids.add(cosmetic["id"])
              hashes.add(cosmetic["bungieHash"])

          print(json.dumps({
              "manifestVersion": catalogue["manifestVersion"],
              "cosmeticRecords": len(catalogue["cosmetics"]),
              "counts": catalogue["counts"],
              "fileBytes": catalogue_path.stat().st_size,
          }, indent=2))
          PYEOF

      - name: Check generated catalogue change
        id: generated
        run: |
          if [ -n "$(git status --porcelain -- astrix-app/data/cosmetic-information.json)" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit cosmetic catalogue
        if: steps.generated.outputs.changed == 'true'
        env:
          MANIFEST_VERSION: ${{ steps.cosmetics.outputs.manifest_version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add astrix-app/data/cosmetic-information.json
          git diff --cached --quiet && exit 0
          git commit -m "Update cosmetic catalogue for Bungie manifest ${MANIFEST_VERSION}"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Write workflow summary
        if: always()
        env:
          MANIFEST_VERSION: ${{ steps.cosmetics.outputs.manifest_version }}
          COSMETICS: ${{ steps.cosmetics.outputs.cosmetics }}
          CURATED: ${{ steps.cosmetics.outputs.curated }}
          MATCHED: ${{ steps.cosmetics.outputs.matched }}
          UNRESOLVED: ${{ steps.cosmetics.outputs.unresolved }}
          AMBIGUOUS: ${{ steps.cosmetics.outputs.ambiguous }}
          FILE_CHANGED: ${{ steps.generated.outputs.changed }}
        run: |
          {
            echo "## Forge cosmetic information update"
            echo
            echo "- Manifest version: ${MANIFEST_VERSION:-unavailable}"
            echo "- Cosmetic records: ${COSMETICS:-0}"
            echo "- Curated source rows: ${CURATED:-0}"
            echo "- Curated rows matched: ${MATCHED:-0}"
            echo "- Unresolved curated rows: ${UNRESOLVED:-0}"
            echo "- Ambiguous curated rows: ${AMBIGUOUS:-0}"
            echo "- Generated catalogue changed: ${FILE_CHANGED:-false}"
          } >> "$GITHUB_STEP_SUMMARY"
