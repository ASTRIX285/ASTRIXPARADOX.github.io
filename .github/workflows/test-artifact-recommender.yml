name: Artifact Recommender Test
on:
  workflow_dispatch:
  push:
    branches: [feature/astrix-multigame-platform]
    paths:
      - 'astrix-app/pages/guardian-workspace-v2/guardian-artifact-recommender.mjs'
      - 'astrix-app/tools/test-artifact-recommender.mjs'
      - 'astrix-app/data/paradox-forge/beta/beta-current-artifact.json'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: node astrix-app/tools/test-artifact-recommender.mjs
