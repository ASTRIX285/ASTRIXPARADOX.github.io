name: Update Forge Armor Information

on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: write

concurrency:
  group: forge-armor-information-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update-armor-information:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout workflow branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install validation dependency
        run: |
          python3 -m pip install \
            "jsonschema[format]>=4.23,<5"

      - name: Generate raw armour catalogue
        id: armor
        env:
          BUNGIE_API_KEY: ${{ secrets.BUNGIE_API_KEY }}
        run: |
          python3 astrix-app/tools/import-armor-information.py

      - name: Extract committed curated armour catalogue
        run: |
          python3 astrix-app/tools/extract-curated-catalogue.py \
            --kind armor \
            --input astrix-app/data/armor-information.json \
            --output astrix-app/data/armor-information.catalogue.json

      - name: Validate curated armour catalogue
        run: |
          python3 - << 'PYEOF'
          import json
          from pathlib import Path

          from jsonschema import Draft202012Validator
          from jsonschema import FormatChecker

          data_path = Path(
              "astrix-app/data/armor-information.catalogue.json"
          )

          schema_path = Path(
              "astrix-app/data/armor-information.schema.json"
          )

          data = json.loads(
              data_path.read_text(encoding="utf-8")
          )

          schema = json.loads(
              schema_path.read_text(encoding="utf-8")
          )

          errors = sorted(
              Draft202012Validator(
                  schema,
                  format_checker=FormatChecker(),
              ).iter_errors(data),
              key=lambda error: list(
                  error.absolute_path
              ),
          )

          if errors:
              for error in errors:
                  print(
                      f"{list(error.absolute_path)}: "
                      f"{error.message}"
                  )

              raise SystemExit(
                  f"{len(errors)} schema validation error(s)"
              )

          ids = set()
          hashes = set()

          for index, item in enumerate(data["armor"]):
              expected = (
                  f"armor-{item['bungieHash']}"
              )

              if item["id"] != expected:
                  raise SystemExit(
                      f"Invalid id at armor[{index}]: "
                      f"expected {expected}"
                  )

              if item["id"] in ids:
                  raise SystemExit(
                      f"Duplicate armour id: "
                      f"{item['id']}"
                  )

              if item["bungieHash"] in hashes:
                  raise SystemExit(
                      f"Duplicate armour hash: "
                      f"{item['bungieHash']}"
                  )

              ids.add(item["id"])
              hashes.add(item["bungieHash"])

          print(
              json.dumps(
                  {
                      "manifestVersion": data[
                          "manifestVersion"
                      ],
                      "servedArmorRecords": len(
                          data["armor"]
                      ),
                      "fileBytes": (
                          data_path.stat().st_size
                      ),
                  },
                  indent=2,
              )
          )
          PYEOF

      - name: Validate compact Forge armour and Artifact index
        run: |
          python3 - << 'PYEOF'
          import json
          from pathlib import Path

          path = Path("astrix-app/data/forge-armour-index.json")
          payload = json.loads(path.read_text(encoding="utf-8"))
          required = {"schemaVersion", "manifestVersion", "generatedAt", "definitions", "socketLayouts", "equipableItemSets", "sandboxPerks", "statDefinitions", "plugDefinitions", "socketCategoryDefinitions", "artifactCatalog"}
          missing = required - payload.keys()
          if missing:
              raise SystemExit(f"Forge armour index fields missing: {sorted(missing)}")
          if payload["schemaVersion"] != 5:
              raise SystemExit(f"Unsupported Forge index schema: {payload['schemaVersion']}")
          if not payload["definitions"]:
              raise SystemExit("Forge armour index contains no armour definitions")
          if any(row.get("itemType") != 2 for row in payload["definitions"].values()):
              raise SystemExit("Forge armour index contains a non-armour definition")
          if not payload["artifactCatalog"]:
              raise SystemExit("Forge index contains no verified Artifact 2.0 catalogue")
          for artifact in payload["artifactCatalog"]:
              if artifact.get("availabilityModel") != "artifact-2-socket-buckets":
                  raise SystemExit("Forge index contains an unsupported Artifact selection model")
              slots = artifact.get("selectionSlots") or []
              perks = artifact.get("perks") or []
              if not slots or not perks or artifact.get("selectionLimit", 0) <= 0:
                  raise SystemExit(f"Incomplete Artifact catalogue record: {artifact.get('hash')}")
          print(json.dumps({
              "manifestVersion": payload["manifestVersion"],
              "armourDefinitions": len(payload["definitions"]),
              "socketLayouts": len(payload["socketLayouts"]),
              "equipableSets": len(payload["equipableItemSets"]),
              "sandboxPerks": len(payload["sandboxPerks"]),
              "artifactCatalog": len(payload["artifactCatalog"]),
              "fileBytes": path.stat().st_size,
          }, indent=2))
          PYEOF

      - name: Check curated catalogue change
        id: generated
        run: |
          if [ -n "$(git status --porcelain -- astrix-app/data/armor-information.catalogue.json astrix-app/data/forge-armour-index.json)" ]
          then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit curated armour catalogue
        if: steps.generated.outputs.changed == 'true'
        env:
          MANIFEST_VERSION: ${{ steps.armor.outputs.manifest_version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            astrix-app/data/armor-information.catalogue.json \
            astrix-app/data/forge-armour-index.json

          git diff --cached --quiet && exit 0

          git commit -m \
            "Update curated armor catalogue for Bungie manifest ${MANIFEST_VERSION}"

          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Remove raw armour catalogue
        if: always()
        run: |
          rm -f astrix-app/data/armor-information.json

      - name: Write workflow summary
        if: always()
        env:
          MANIFEST_VERSION: ${{ steps.armor.outputs.manifest_version }}
          ARMOR: ${{ steps.armor.outputs.armor }}
          CURATED: ${{ steps.armor.outputs.curated }}
          MATCHED: ${{ steps.armor.outputs.matched }}
          UNRESOLVED: ${{ steps.armor.outputs.unresolved }}
          AMBIGUOUS: ${{ steps.armor.outputs.ambiguous }}
          ARTIFACT_CATALOG: ${{ steps.armor.outputs.artifact_catalog }}
          FILE_CHANGED: ${{ steps.generated.outputs.changed }}
        run: |
          {
            echo "## Forge armour information update"
            echo
            echo "- Manifest version: ${MANIFEST_VERSION:-unavailable}"
            echo "- Raw official records generated: ${ARMOR:-0}"
            echo "- Curated rows: ${CURATED:-0}"
            echo "- Curated rows matched: ${MATCHED:-0}"
            echo "- Unresolved rows: ${UNRESOLVED:-0}"
            echo "- Ambiguous rows: ${AMBIGUOUS:-0}"
            echo "- Verified Artifact 2.0 records: ${ARTIFACT_CATALOG:-0}"
            echo "- Served catalogue changed: ${FILE_CHANGED:-false}"
            echo "- Raw catalogue retained: no"
          } >> "$GITHUB_STEP_SUMMARY"
