name: D2 page load post deploy evidence

on:
  push:
    branches:
      - diag/d2-page-load-post-209
    paths:
      - '.github/workflows/d2-page-load-post.yml'

permissions:
  contents: read

jobs:
  read-worker-analytics:
    runs-on: ubuntu-latest
    steps:
      - name: Read post deploy Worker timing
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          node - <<'NODE'
          const query=`query WorkerPostDeploy($accountTag: string, $start: string, $end: string, $script: string) {
            viewer {
              accounts(filter: {accountTag: $accountTag}) {
                workersInvocationsAdaptive(limit: 10000, filter: {scriptName: $script, datetime_geq: $start, datetime_leq: $end}) {
                  sum { requests errors subrequests cpuTimeUs requestDuration responseBodySize wallTime }
                  quantiles { cpuTimeP50 cpuTimeP99 requestDurationP50 requestDurationP99 responseBodySizeP50 responseBodySizeP99 wallTimeP50 wallTimeP99 }
                  max { cpuTime requestDuration responseBodySize wallTime }
                  dimensions { scriptName scriptVersion status }
                }
              }
            }
          }`;
          const start='2026-09-11T09:34:00.000Z';
          const end=new Date().toISOString();
          const response=await fetch('https://api.cloudflare.com/client/v4/graphql',{
            method:'POST',
            headers:{Authorization:`Bearer ${process.env.CLOUDFLARE_API_TOKEN}`,'Content-Type':'application/json'},
            body:JSON.stringify({query,variables:{accountTag:process.env.CLOUDFLARE_ACCOUNT_ID,start,end,script:'astrix-destiny-backend'}})
          });
          const body=await response.json();
          if(!response.ok||body.errors?.length)throw new Error(`Cloudflare analytics failed ${response.status}: ${JSON.stringify(body.errors||[])}`);
          console.log(JSON.stringify({start,end,versions:body.data?.viewer?.accounts?.[0]?.workersInvocationsAdaptive||[]}));
          const requestQuery=`query WorkerPostDeployRequests($accountTag: string, $start: string, $end: string, $script: string) {
            viewer {
              accounts(filter: {accountTag: $accountTag}) {
                workersInvocationsAdaptive(limit: 10000, filter: {scriptName: $script, datetime_geq: $start, datetime_leq: $end}) {
                  sum { requests errors subrequests cpuTimeUs requestDuration responseBodySize wallTime }
                  quantiles { cpuTimeP50 cpuTimeP99 requestDurationP50 requestDurationP99 responseBodySizeP50 responseBodySizeP99 wallTimeP50 wallTimeP99 }
                  max { cpuTime requestDuration responseBodySize wallTime }
                  dimensions { datetime scriptName scriptVersion status }
                }
              }
            }
          }`;
          const requestStart='2026-09-11T09:42:25.000Z';
          const requestEnd='2026-09-11T09:53:30.000Z';
          const requestResponse=await fetch('https://api.cloudflare.com/client/v4/graphql',{
            method:'POST',
            headers:{Authorization:`Bearer ${process.env.CLOUDFLARE_API_TOKEN}`,'Content-Type':'application/json'},
            body:JSON.stringify({query:requestQuery,variables:{accountTag:process.env.CLOUDFLARE_ACCOUNT_ID,start:requestStart,end:requestEnd,script:'astrix-destiny-backend'}})
          });
          const requestBody=await requestResponse.json();
          if(!requestResponse.ok||requestBody.errors?.length)throw new Error(`Cloudflare request analytics failed ${requestResponse.status}: ${JSON.stringify(requestBody.errors||[])}`);
          const notableResponses=(requestBody.data?.viewer?.accounts?.[0]?.workersInvocationsAdaptive||[])
            .filter(row=>Number(row.quantiles?.responseBodySizeP50||0)>500_000||Number(row.quantiles?.requestDurationP50||0)>500_000||Number(row.sum?.subrequests||0)>5)
            .sort((left,right)=>String(left.dimensions?.datetime).localeCompare(String(right.dimensions?.datetime)));
          console.log(JSON.stringify({requestStart,requestEnd,notableResponses}));
          const beforeStart='2026-09-02T00:00:00.000Z';
          const beforeEnd='2026-09-05T23:59:59.999Z';
          const beforeResponse=await fetch('https://api.cloudflare.com/client/v4/graphql',{
            method:'POST',
            headers:{Authorization:`Bearer ${process.env.CLOUDFLARE_API_TOKEN}`,'Content-Type':'application/json'},
            body:JSON.stringify({query:requestQuery,variables:{accountTag:process.env.CLOUDFLARE_ACCOUNT_ID,start:beforeStart,end:beforeEnd,script:'astrix-destiny-backend'}})
          });
          const beforeBody=await beforeResponse.json();
          if(!beforeResponse.ok||beforeBody.errors?.length)throw new Error(`Cloudflare before-week analytics failed ${beforeResponse.status}: ${JSON.stringify(beforeBody.errors||[])}`);
          const beforeRows=(beforeBody.data?.viewer?.accounts?.[0]?.workersInvocationsAdaptive||[])
            .filter(row=>Number(row.quantiles?.responseBodySizeP50||0)>500_000);
          const buckets=new Map();
          for(const row of beforeRows){
            const size=Number(row.quantiles?.responseBodySizeP50||0);
            const key=Math.round(size/100_000)*100_000;
            const prior=buckets.get(key)||{responseBytes:key,seconds:0,requests:0,subrequests:0,cpuTimeUs:0,requestDurationUs:0,minBytes:Number.POSITIVE_INFINITY,maxBytes:0};
            prior.seconds+=1;
            prior.requests+=Number(row.sum?.requests||0);
            prior.subrequests+=Number(row.sum?.subrequests||0);
            prior.cpuTimeUs+=Number(row.sum?.cpuTimeUs||0);
            prior.requestDurationUs+=Number(row.sum?.requestDuration||0);
            prior.minBytes=Math.min(prior.minBytes,size);
            prior.maxBytes=Math.max(prior.maxBytes,size);
            buckets.set(key,prior);
          }
          const beforeSizeBuckets=[...buckets.values()].map(row=>({...row,subrequestsPerRequest:row.requests?row.subrequests/row.requests:0,averageCpuUs:row.requests?row.cpuTimeUs/row.requests:0,averageDurationUs:row.requests?row.requestDurationUs/row.requests:0})).sort((left,right)=>right.responseBytes-left.responseBytes);
          console.log(JSON.stringify({beforeStart,beforeEnd,beforeSizeBuckets}));
          NODE
