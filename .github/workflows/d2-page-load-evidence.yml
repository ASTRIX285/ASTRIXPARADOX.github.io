name: D2 page load evidence

on:
  push:
    branches:
      - codex/d2-page-load-recovery
    paths:
      - '.github/workflows/d2-page-load-evidence.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover-observability-fields:
    runs-on: ubuntu-latest
    steps:
      - name: Read safe telemetry field names
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          node - <<'NODE'
          const now=Date.now();
          const response=await fetch(`https://api.cloudflare.com/client/v4/accounts/${process.env.CLOUDFLARE_ACCOUNT_ID}/workers/observability/telemetry/keys`,{
            method:'POST',
            headers:{Authorization:`Bearer ${process.env.CLOUDFLARE_API_TOKEN}`,'Content-Type':'application/json'},
            body:JSON.stringify({
              datasets:[],
              from:now-3*24*60*60*1000,
              to:now,
              keyNeedle:{value:'workers',matchCase:false,isRegex:false},
              limit:2000
            })
          });
          const body=await response.json();
          if(!response.ok||body.success!==true)throw new Error(`Cloudflare telemetry keys failed ${response.status}: ${JSON.stringify(body.errors||body.messages||[])}`);
          const useful=(body.result||[]).filter(row=>/(cpu|wall|duration|response|size|url|script|service|status|timestamp)/i.test(row.key));
          console.log(JSON.stringify({status:response.status,keys:useful},null,2));
          NODE
