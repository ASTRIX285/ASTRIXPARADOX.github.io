name: D2 page load evidence

on:
  push:
    branches:
      - codex/d2-page-load-recovery
    paths:
      - '.github/workflows/d2-page-load-evidence.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  read-worker-analytics:
    runs-on: ubuntu-latest
    steps:
      - name: Read aggregate Worker timing windows
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          node - <<'NODE'
          const query=`query WorkerTiming($accountTag: string, $start: string, $end: string, $script: string) {
            viewer {
              accounts(filter: {accountTag: $accountTag}) {
                workersInvocationsAdaptive(limit: 10000, filter: {scriptName: $script, datetime_geq: $start, datetime_leq: $end}) {
                  sum { requests errors subrequests }
                  quantiles { cpuTimeP50 cpuTimeP99 }
                  dimensions { datetime scriptName status }
                }
              }
            }
          }`;
          async function readWindow(name,start,end){
            const response=await fetch('https://api.cloudflare.com/client/v4/graphql',{
            method:'POST',
              headers:{Authorization:`Bearer ${process.env.CLOUDFLARE_API_TOKEN}`,'Content-Type':'application/json'},
              body:JSON.stringify({query,variables:{accountTag:process.env.CLOUDFLARE_ACCOUNT_ID,start,end,script:'astrix-destiny-backend'}})
            });
            const body=await response.json();
            if(!response.ok||body.errors?.length)throw new Error(`Cloudflare analytics failed ${response.status}: ${JSON.stringify(body.errors||[])}`);
            const rows=body.data?.viewer?.accounts?.[0]?.workersInvocationsAdaptive||[];
            const summary=rows.reduce((result,row)=>({
              requests:result.requests+Number(row.sum?.requests||0),
              errors:result.errors+Number(row.sum?.errors||0),
              subrequests:result.subrequests+Number(row.sum?.subrequests||0),
              maxCpuP50:Math.max(result.maxCpuP50,Number(row.quantiles?.cpuTimeP50||0)),
              maxCpuP99:Math.max(result.maxCpuP99,Number(row.quantiles?.cpuTimeP99||0))
            }),{requests:0,errors:0,subrequests:0,maxCpuP50:0,maxCpuP99:0});
            console.log(JSON.stringify({name,start,end,...summary}));
          }
          const versionQuery=`query WorkerVersionTiming($accountTag: string, $start: string, $end: string, $script: string) {
            viewer {
              accounts(filter: {accountTag: $accountTag}) {
                workersInvocationsAdaptive(limit: 1000, filter: {scriptName: $script, datetime_geq: $start, datetime_leq: $end}) {
                  sum { requests errors subrequests cpuTimeUs requestDuration responseBodySize wallTime }
                  quantiles { cpuTimeP50 cpuTimeP99 requestDurationP50 requestDurationP99 responseBodySizeP50 responseBodySizeP99 wallTimeP50 wallTimeP99 }
                  max { cpuTime requestDuration responseBodySize wallTime }
                  dimensions { scriptName scriptVersion status }
                }
              }
            }
          }`;
          async function readVersionWindow(name,start,end){
            const response=await fetch('https://api.cloudflare.com/client/v4/graphql',{
              method:'POST',
              headers:{Authorization:`Bearer ${process.env.CLOUDFLARE_API_TOKEN}`,'Content-Type':'application/json'},
              body:JSON.stringify({query:versionQuery,variables:{accountTag:process.env.CLOUDFLARE_ACCOUNT_ID,start,end,script:'astrix-destiny-backend'}})
            });
            const body=await response.json();
            if(!response.ok||body.errors?.length)throw new Error(`Cloudflare version analytics failed ${response.status}: ${JSON.stringify(body.errors||[])}`);
            console.log(JSON.stringify({name,start,end,versions:body.data?.viewer?.accounts?.[0]?.workersInvocationsAdaptive||[]}));
          }
          await readWindow('before-week','2026-09-02T00:00:00.000Z','2026-09-05T00:00:00.000Z');
          await readWindow('regression-window','2026-09-10T13:15:00.000Z','2026-09-11T09:00:00.000Z');
          await readVersionWindow('before-week-by-version','2026-09-02T00:00:00.000Z','2026-09-05T00:00:00.000Z');
          await readVersionWindow('regression-by-version','2026-09-10T13:15:00.000Z','2026-09-11T09:00:00.000Z');

          const requestQuery=`query WorkerRequests($accountTag: string, $start: string, $end: string, $script: string) {
            viewer {
              accounts(filter: {accountTag: $accountTag}) {
                workersInvocationsAdaptive(limit: 10000, filter: {scriptName: $script, datetime_geq: $start, datetime_leq: $end}) {
                  sum { requests errors subrequests cpuTimeUs requestDuration responseBodySize wallTime }
                  quantiles { cpuTimeP50 cpuTimeP99 requestDurationP50 requestDurationP99 responseBodySizeP50 responseBodySizeP99 wallTimeP50 wallTimeP99 }
                  max { cpuTime requestDuration responseBodySize wallTime }
                  dimensions { datetime scriptName scriptVersion status }
                }
              }
            }
          }`;
          const requestResponse=await fetch('https://api.cloudflare.com/client/v4/graphql',{
            method:'POST',
            headers:{Authorization:`Bearer ${process.env.CLOUDFLARE_API_TOKEN}`,'Content-Type':'application/json'},
            body:JSON.stringify({query:requestQuery,variables:{accountTag:process.env.CLOUDFLARE_ACCOUNT_ID,start:'2026-09-10T13:15:00.000Z',end:'2026-09-11T09:00:00.000Z',script:'astrix-destiny-backend'}})
          });
          const requestBody=await requestResponse.json();
          if(!requestResponse.ok||requestBody.errors?.length)throw new Error(`Cloudflare request analytics failed ${requestResponse.status}: ${JSON.stringify(requestBody.errors||[])}`);
          const largeResponses=(requestBody.data?.viewer?.accounts?.[0]?.workersInvocationsAdaptive||[])
            .filter(row=>Number(row.quantiles?.responseBodySizeP50||0)>5_000_000)
            .sort((left,right)=>String(left.dimensions?.datetime).localeCompare(String(right.dimensions?.datetime)));
          console.log(JSON.stringify({largeResponses}));

          const introspectionQuery=`query WorkerSchema {
            account: __type(name: "Account") {
              fields { name description type { kind name ofType { kind name } } }
            }
            types: __schema {
              types { name fields { name description type { kind name ofType { kind name } } } }
            }
          }`;
          const schemaResponse=await fetch('https://api.cloudflare.com/client/v4/graphql',{
            method:'POST',
            headers:{Authorization:`Bearer ${process.env.CLOUDFLARE_API_TOKEN}`,'Content-Type':'application/json'},
            body:JSON.stringify({query:introspectionQuery})
          });
          const schemaBody=await schemaResponse.json();
          if(!schemaResponse.ok||schemaBody.errors?.length)throw new Error(`Cloudflare schema query failed ${schemaResponse.status}: ${JSON.stringify(schemaBody.errors||[])}`);
          const parentTypes=(schemaBody.data?.types?.types||[]).map(type=>({
            name:type.name,
            fields:(type.fields||[]).filter(field=>/worker|trace|observ/i.test(field.name))
          })).filter(type=>type.fields.length);
          console.log(JSON.stringify({parentTypes}));
          NODE
