name: Refresh Bungie Manifest Data

on:
  workflow_dispatch:
    inputs:
      force:
        description: Force rebuild even if Bungie manifest version is unchanged
        required: false
        default: false
        type: boolean
  schedule:
    - cron: '23 4 * * *'

permissions:
  contents: write

concurrency:
  group: forge-bungie-manifest-refresh-main
  cancel-in-progress: false

jobs:
  refresh-bungie-derived-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Refresh Bungie-derived data when manifest changes
        id: refresh
        env:
          BUNGIE_API_KEY: ${{ secrets.BUNGIE_API_KEY }}
          FORCE_REFRESH: ${{ inputs.force || false }}
        run: |
          args=()
          if [ "${FORCE_REFRESH}" = "true" ]; then
            args+=(--force)
          fi
          python3 astrix-app/tools/refresh-bungie-derived-data.py "${args[@]}"

      - name: Show generated diff
        if: steps.refresh.outputs.refreshed == 'true'
        run: |
          git status --short
          git diff --stat

      - name: Commit refreshed Bungie data
        if: steps.refresh.outputs.refreshed == 'true'
        env:
          MANIFEST_VERSION: ${{ steps.refresh.outputs.manifest_version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            astrix-app/data/bungie-manifest-state.json \
            astrix-app/data/component-icons.json \
            astrix-app/data/paradox-forge/beta/beta-bungie-manifest-cache.json \
            astrix-app/pages/guardian-workspace-v2/guardian-loadout-definitions.mjs
          if git diff --cached --quiet; then
            echo "No generated file changes to commit."
            exit 0
          fi
          git commit -m "Refresh Bungie data for manifest ${MANIFEST_VERSION}"
          git push origin HEAD:main

      - name: Write workflow summary
        if: always()
        env:
          CURRENT: ${{ steps.refresh.outputs.manifest_version }}
          PREVIOUS: ${{ steps.refresh.outputs.previous_manifest_version }}
          CHANGED: ${{ steps.refresh.outputs.manifest_changed }}
          REFRESHED: ${{ steps.refresh.outputs.refreshed }}
          ICONS: ${{ steps.refresh.outputs.component_icon_count }}
          RESOLVED: ${{ steps.refresh.outputs.beta_resolved }}
          UNRESOLVED: ${{ steps.refresh.outputs.beta_unresolved }}
        run: |
          {
            echo "## Bungie manifest refresh"
            echo
            echo "- Bungie manifest: ${CURRENT:-unavailable}"
            echo "- Previous stored manifest: ${PREVIOUS:-none}"
            echo "- Manifest changed: ${CHANGED:-unknown}"
            echo "- Generated data refreshed: ${REFRESHED:-false}"
            if [ "${REFRESHED}" = "true" ]; then
              echo "- Component icons: ${ICONS:-unknown}"
              echo "- Beta inventory definitions resolved: ${RESOLVED:-unknown}"
              echo "- Beta inventory definitions unresolved: ${UNRESOLVED:-unknown}"
            fi
            echo
            echo "Curated Paradox intelligence is not modified by this workflow."
          } >> "$GITHUB_STEP_SUMMARY"
