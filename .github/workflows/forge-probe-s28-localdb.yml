name: Forge Probe S28 Local DB
on:
  push:
    branches: [feature/astrix-multigame-platform]
    paths: ['.github/workflows/forge-probe-s28-localdb.yml']
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/astrix-multigame-platform
      - run: python3 .forge-community/probe-current-artifact-v2.py
      - name: Read perk and weapon rows from downloaded manifest
        run: |
          python3 - <<'PY'
          import json,sqlite3
          def s(h): return h if h<2147483648 else h-4294967296
          c=sqlite3.connect('/tmp/world.content').cursor()
          a=json.loads(c.execute('select json from DestinyArtifactDefinition where id=?',(s(2894222926),)).fetchone()[0])
          for ci,t in enumerate(a['tiers'],1):
            for oi,x in enumerate(t['items'],1):
              h=x['itemHash']; d=json.loads(c.execute('select json from DestinyInventoryItemDefinition where id=?',(s(h),)).fetchone()[0]); p=d.get('displayProperties') or {}
              print('PERK='+json.dumps({'hash':h,'name':p.get('name'),'description':p.get('description'),'column':ci,'order':oi},separators=(',',':')))
          for h in [4019651319,2965080304,17096506]:
            d=json.loads(c.execute('select json from DestinyInventoryItemDefinition where id=?',(s(h),)).fetchone()[0]); p=d.get('displayProperties') or {}
            print('WEAPON='+json.dumps({'hash':h,'name':p.get('name'),'itemTypeDisplayName':d.get('itemTypeDisplayName'),'itemSubType':d.get('itemSubType'),'defaultDamageTypeHash':d.get('defaultDamageTypeHash')},separators=(',',':')))
          PY
