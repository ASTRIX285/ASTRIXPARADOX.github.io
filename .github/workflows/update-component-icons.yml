name: Update Forge Component Icons

on:
  workflow_dispatch:
  schedule:
    - cron: '17 4 * * 1'

permissions:
  contents: write

concurrency:
  group: forge-component-icons-${{ github.ref }}
  cancel-in-progress: false

jobs:
  import-component-icons:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout workflow branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Import icons from Bungie manifest
        id: import-icons
        env:
          BUNGIE_API_KEY: ${{ secrets.BUNGIE_API_KEY }}
        run: python3 astrix-app/tools/import-component-icons.py --force

      - name: Validate generated icon map
        if: steps.import-icons.outputs.changed == 'true'
        run: |
          python3 - << 'PYEOF'
          import json
          from pathlib import Path

          path = Path('astrix-app/data/component-icons.json')
          data = json.loads(path.read_text(encoding='utf-8'))

          required = {
              'manifestVersion',
              'generatedAt',
              'totalComponents',
              'matchedComponents',
              'icons',
          }
          missing = required.difference(data)
          if missing:
              raise SystemExit(f'Missing icon-map fields: {sorted(missing)}')
          if not isinstance(data['icons'], dict):
              raise SystemExit('icons must be an object')
          if data['matchedComponents'] != len(data['icons']):
              raise SystemExit('matchedComponents must equal the number of icon entries')

          for component_id, icon_path in data['icons'].items():
              if not isinstance(component_id, str) or not component_id:
                  raise SystemExit('Every icon-map key must be a component id string')
              if not isinstance(icon_path, str) or not icon_path.startswith(
                  '/common/destiny2_content/icons/'
              ):
                  raise SystemExit(f'Invalid icon path for {component_id}: {icon_path!r}')

          print(json.dumps({
              'manifestVersion': data['manifestVersion'],
              'matchedComponents': data['matchedComponents'],
              'totalComponents': data['totalComponents'],
          }, indent=2))
          PYEOF

      - name: Commit icon map when manifest changes
        if: steps.import-icons.outputs.changed == 'true'
        env:
          MANIFEST_VERSION: ${{ steps.import-icons.outputs.manifest_version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add astrix-app/data/component-icons.json
          git diff --cached --quiet && exit 0
          git commit -m "Update component icons for Bungie manifest ${MANIFEST_VERSION}"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Write workflow summary
        if: always()
        env:
          CHANGED: ${{ steps.import-icons.outputs.changed }}
          MANIFEST_VERSION: ${{ steps.import-icons.outputs.manifest_version }}
          MATCHED: ${{ steps.import-icons.outputs.matched }}
          TOTAL: ${{ steps.import-icons.outputs.total }}
          UNMATCHED: ${{ steps.import-icons.outputs.unmatched }}
          AMBIGUOUS: ${{ steps.import-icons.outputs.ambiguous }}
        run: |
          {
            echo "## Forge component icon import"
            echo
            echo "- Manifest version: ${MANIFEST_VERSION:-unavailable}"
            echo "- Generated new map: ${CHANGED:-false}"
            if [ "${CHANGED}" = "true" ]; then
              echo "- Matched: ${MATCHED}/${TOTAL}"
              echo "- Unmatched: ${UNMATCHED}"
              echo "- Ambiguous: ${AMBIGUOUS}"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
