# AION 2 character read proxy (The Aetherium). Deployed by hand only: no GitHub
# Action deploys this folder. See the PR description for Miguel's deploy steps.
name = "aetherium-worker"
main = "src/index.mjs"
compatibility_date = "2026-08-13"
workers_dev = true

[vars]
ENVIRONMENT = "production"

# 10 minute response cache per normalised request.
# Namespace created by Miguel on 5 Oct 2026 (npx wrangler kv namespace create AION2_CACHE).
[[kv_namespaces]]
binding = "AION2_CACHE"
id = "6d3c6cb3d4b84ea19306411e93453eb8"

# 60 requests a minute per visitor IP (CF-Connecting-IP). The Worker also keeps
# its own per-isolate 60 a minute guard, so it stays limited without this binding.
[[ratelimits]]
name = "AION2_RATE_LIMITER"
namespace_id = "2851"
simple = { limit = 60, period = 60 }

# Custom domain. Uncomment after the first deploy works on workers.dev.
# [[routes]]
# pattern = "aion2.astrixparadox.com"
# custom_domain = true
