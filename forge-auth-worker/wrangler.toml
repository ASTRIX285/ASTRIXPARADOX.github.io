name = "astrix-destiny-backend"
main = "src/semantic-wrapper.ts"
compatibility_date = "2026-08-13"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

[triggers]
crons = ["17 * * * *"]

[vars]
ENVIRONMENT = "production"
APP_ORIGINS = "https://astrixparadox.com,https://app.astrixparadox.com,https://sandbox.astrixparadox.com,http://localhost:8000,http://127.0.0.1:8000,http://localhost:5500,http://127.0.0.1:5500,http://localhost:5501,http://127.0.0.1:5501"
OAUTH_REDIRECT_URI = "https://auth.astrixparadox.com/bungie/callback"
DEFAULT_RETURN_URL = "https://astrixparadox.com/astrix-app/pages/journey/"

[secrets]
required = ["BUNGIE_API_KEY", "BUNGIE_CLIENT_ID", "BUNGIE_CLIENT_SECRET"]

[[routes]]
pattern = "auth.astrixparadox.com"
custom_domain = true

[[durable_objects.bindings]]
name = "AUTH_RECORDS"
class_name = "AuthRecord"

[exports.AuthRecord]
type = "durable-object"
storage = "sqlite"

[observability]
enabled = true
head_sampling_rate = 1.0

[[services]]
binding = "MANIFEST_DATA"
service = "astrix-manifest-data"

# Production custom domains are attached after the Worker is deployed and
# astrixparadox.com is confirmed active in the owning Cloudflare account:
# auth.astrixparadox.com
# api.astrixparadox.com
#
# Required encrypted Worker secrets (never commit values here):
# BUNGIE_API_KEY
# BUNGIE_CLIENT_ID
# BUNGIE_CLIENT_SECRET
