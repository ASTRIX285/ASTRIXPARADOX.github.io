<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 64">
  <!-- Atreia Atlas layer icons (ours, feature/aetherium-map-foundation, 28 Oct 2026): a lit medallion with a gem-cut glyph per layer.
       Draw one with <img src="atlas-layers.svg#hidden-cube">, each id is a <view> onto its 64 by 64 cell. -->
  <defs>
    <radialGradient id="disc" cx="50%" cy="35%" r="70%"><stop offset="0" stop-color="#2a4470"/><stop offset=".6" stop-color="#132240"/><stop offset="1" stop-color="#070d1c"/></radialGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f4d27c"/><stop offset=".5" stop-color="#b98a2e"/><stop offset="1" stop-color="#6d4f17"/></linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".35"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff1c2"/><stop offset=".45" stop-color="#f0c45a"/><stop offset="1" stop-color="#a8731d"/></linearGradient>
    <linearGradient id="goldside" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#d79f35"/><stop offset="1" stop-color="#7a5212"/></linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset=".4" stop-color="#9ff0ff"/><stop offset="1" stop-color="#1f9fd0"/></linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#d6ecff"/><stop offset=".5" stop-color="#5aa8f0"/><stop offset="1" stop-color="#1c4f9a"/></linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e3ffd0"/><stop offset=".5" stop-color="#6fd36a"/><stop offset="1" stop-color="#1f7a3a"/></linearGradient>
    <linearGradient id="red" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffd2c4"/><stop offset=".45" stop-color="#e6493a"/><stop offset="1" stop-color="#7d1410"/></linearGradient>
    <linearGradient id="stone" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e8e2d6"/><stop offset=".5" stop-color="#9f978a"/><stop offset="1" stop-color="#4f4a44"/></linearGradient>
    <radialGradient id="ember" cx="50%" cy="70%" r="60%"><stop offset="0" stop-color="#ffe2a0"/><stop offset=".5" stop-color="#ff8a2a"/><stop offset="1" stop-color="#7a2a08"/></radialGradient>
    <radialGradient id="violet" cx="50%" cy="50%" r="55%"><stop offset="0" stop-color="#ffffff"/><stop offset=".35" stop-color="#d7b8ff"/><stop offset=".75" stop-color="#8a4dff"/><stop offset="1" stop-color="#3a1580"/></radialGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="1.4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <g id="medal">
      <circle cx="32" cy="32" r="29" fill="url(#rim)"/>
      <circle cx="32" cy="32" r="26" fill="url(#disc)"/>
      <circle cx="32" cy="32" r="26" fill="none" stroke="#000" stroke-opacity=".5" stroke-width="1"/>
      <ellipse cx="32" cy="18" rx="18" ry="9" fill="url(#shine)"/>
    </g>
  </defs>

  <view id="hidden-cube" viewBox="0 0 64 64"/>
  <g>
    <use href="#medal"/>
    <g filter="url(#glow)">
      <path d="M32 15 L47 23 L32 31 L17 23 Z" fill="url(#gold)"/>
      <path d="M17 23 L32 31 L32 49 L17 41 Z" fill="url(#goldside)"/>
      <path d="M47 23 L32 31 L32 49 L47 41 Z" fill="#8c5e14"/>
      <path d="M32 15 L47 23 L32 31 L17 23 Z M32 31 V49" fill="none" stroke="#fff3cc" stroke-opacity=".7" stroke-width="1"/>
      <circle cx="32" cy="23" r="2.4" fill="#fff"/>
    </g>
  </g>

  <view id="empyrean-trace" viewBox="64 0 64 64"/>
  <g transform="translate(64 0)">
    <use href="#medal"/>
    <g filter="url(#glow)">
      <path d="M32 12 C34 26 38 30 52 32 C38 34 34 38 32 52 C30 38 26 34 12 32 C26 30 30 26 32 12 Z" fill="url(#cyan)"/>
      <path d="M44 16 C45 20 46 21 50 22 C46 23 45 24 44 28 C43 24 42 23 38 22 C42 21 43 20 44 16 Z" fill="#e6fbff"/>
      <circle cx="32" cy="32" r="3" fill="#fff"/>
    </g>
  </g>

  <view id="kibelisk" viewBox="128 0 64 64"/>
  <g transform="translate(128 0)">
    <use href="#medal"/>
    <g filter="url(#glow)">
      <path d="M32 10 L40 20 L37 46 L27 46 L24 20 Z" fill="url(#blue)"/>
      <path d="M32 10 L32 46 L27 46 L24 20 Z" fill="#ffffff" fill-opacity=".25"/>
      <path d="M20 46 H44 L46 52 H18 Z" fill="url(#stone)"/>
      <circle cx="32" cy="24" r="2.6" fill="#fff"/>
    </g>
  </g>

  <view id="gathering" viewBox="192 0 64 64"/>
  <g transform="translate(192 0)">
    <use href="#medal"/>
    <g filter="url(#glow)">
      <path d="M32 50 C31 40 31 32 33 22" fill="none" stroke="#1f6a33" stroke-width="2.5" stroke-linecap="round"/>
      <path d="M33 24 C38 12 50 12 52 14 C50 26 40 30 33 24 Z" fill="url(#green)"/>
      <path d="M31 34 C26 24 14 24 12 26 C14 38 26 40 31 34 Z" fill="url(#green)"/>
      <path d="M33 24 C40 20 46 17 51 15 M31 34 C24 31 18 29 13 27" fill="none" stroke="#f0ffe6" stroke-opacity=".7" stroke-width="1"/>
    </g>
  </g>

  <view id="named-monster" viewBox="256 0 64 64"/>
  <g transform="translate(256 0)">
    <use href="#medal"/>
    <g filter="url(#glow)">
      <path d="M18 14 C20 22 22 25 25 27 L22 20 Z M46 14 C44 22 42 25 39 27 L42 20 Z" fill="url(#gold)"/>
      <path d="M32 20 C42 20 47 27 46 35 C45 42 40 48 32 50 C24 48 19 42 18 35 C17 27 22 20 32 20 Z" fill="url(#red)"/>
      <path d="M23 33 L30 36 L24 39 Z M41 33 L34 36 L40 39 Z" fill="#ffe36b"/>
      <path d="M27 44 L29 41 L31 44 L33 41 L35 44 L37 41" fill="none" stroke="#2a0503" stroke-width="1.5"/>
    </g>
  </g>

  <view id="dungeon-entrance" viewBox="320 0 64 64"/>
  <g transform="translate(320 0)">
    <use href="#medal"/>
    <g filter="url(#glow)">
      <path d="M14 50 V30 C14 18 22 12 32 12 C42 12 50 18 50 30 V50 H42 V31 C42 24 38 20 32 20 C26 20 22 24 22 31 V50 Z" fill="url(#stone)"/>
      <path d="M22 50 V31 C22 24 26 20 32 20 C38 20 42 24 42 31 V50 Z" fill="url(#ember)"/>
      <path d="M28 12.6 L30 20 M36 12.6 L34 20 M14.6 26 L22 28 M49.4 26 L42 28" stroke="#3b3631" stroke-width="1.2"/>
    </g>
  </g>

  <view id="rift" viewBox="384 0 64 64"/>
  <g transform="translate(384 0)">
    <use href="#medal"/>
    <g filter="url(#glow)">
      <ellipse cx="32" cy="32" rx="14" ry="19" fill="url(#violet)"/>
      <path d="M32 13 C24 20 40 26 32 32 C24 38 40 44 32 51" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
      <path d="M19 22 C14 30 14 36 19 44 M45 22 C50 30 50 36 45 44" fill="none" stroke="#c6a2ff" stroke-width="1.6" stroke-linecap="round"/>
    </g>
  </g>

  <view id="place" viewBox="448 0 64 64"/>
  <g transform="translate(448 0)">
    <use href="#medal"/>
    <g filter="url(#glow)">
      <path d="M22 13 V51" stroke="url(#stone)" stroke-width="3" stroke-linecap="round"/>
      <path d="M23.5 14 C30 11 36 17 44 14 V32 C36 35 30 29 23.5 32 Z" fill="url(#gold)"/>
      <path d="M23.5 23 C30 20 36 26 44 23" fill="none" stroke="#fff3cc" stroke-opacity=".7" stroke-width="1"/>
      <path d="M16 51 H28" stroke="url(#stone)" stroke-width="3" stroke-linecap="round"/>
    </g>
  </g>
</svg>
